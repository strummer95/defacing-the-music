<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Defacing The Music - cover B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400;1,6..72,500&family=Playfair+Display:ital,wght@0,700;1,400&family=Public+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 3000px; height: 3000px; overflow: hidden; background: #F3EFE4; }
  .cover {
    width: 3000px; height: 3000px; position: relative;
    background: #F3EFE4;
    color: #141413;
  }
  .cover::before {
    content: "";
    position: absolute; inset: 0;
    background-image: url(grain-sq.webp);
    background-size: 1400px 1400px;
    opacity: 0.22;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 8;
  }
  .frame {
    position: absolute;
    inset: 90px;
    border: 3px solid #141413;
    z-index: 2;
    pointer-events: none;
  }
  .inner {
    position: absolute;
    inset: 108px;
    border: 1px solid #141413;
    z-index: 2;
    pointer-events: none;
  }
  .top {
    position: absolute;
    top: 150px; left: 180px; right: 180px;
    z-index: 5;
    text-align: center;
  }
  .util {
    font-family: "Public Sans", sans-serif;
    font-size: 28px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 600;
    color: #2A4036;
    margin-bottom: 36px;
    display: flex;
    justify-content: space-between;
  }
  .rules {
    border-top: 8px solid #141413;
    border-bottom: 3px solid #141413;
    height: 18px;
  }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700;
    font-size: 238px;
    letter-spacing: 0.01em;
    line-height: 0.88;
    text-transform: uppercase;
    padding: 28px 0 18px;
  }
  .photo {
    position: absolute;
    top: 780px;
    left: 280px;
    right: 280px;
    z-index: 4;
  }
  .photo img {
    width: 100%;
    height: auto;
    display: block;
    background: #E8E2D4;
    border: 3px solid #141413;
  }
  .bottom {
    position: absolute;
    left: 180px; right: 180px; bottom: 160px;
    z-index: 5;
    text-align: center;
  }
  .deck {
    font-family: Newsreader, Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 64px;
    line-height: 1.15;
    color: #141413;
    margin-bottom: 36px;
  }
  .by {
    font-family: "Public Sans", sans-serif;
    font-size: 28px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 600;
    color: #2A4036;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="frame"></div>
    <div class="inner"></div>
    <div class="top">
      <p class="util"><span>Chicagoland</span><span>A comedy podcast</span><span>Est. 2026</span></p>
      <div class="rules"></div>
      <h1>Defacing<br>The Music</h1>
      <div class="rules"></div>
    </div>
    <div class="photo">
      <img src="hosts-web.webp" alt="Duck and Pat">
    </div>
    <div class="bottom">
      <p class="deck">Rock and roll's worst nights, and who to blame for them.</p>
      <p class="by">Duck + Pat</p>
    </div>
  </div>
</body>
</html>
