name: Claude builder (Defacing The Music)
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: claude-builder
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Skip if a Claude PR is already open
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("claude/"))] | length')
          echo "open=$n" >> "$GITHUB_OUTPUT"
      - name: Install Claude Code
        if: steps.gate.outputs.open == '0'
        run: npm install -g @anthropic-ai/claude-code
      - name: Do one task
        if: steps.gate.outputs.open == '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "claude-builder"
          git config user.email "claude-builder@users.noreply.github.com"
          claude -p "You are the hourly Claude builder for strummer95/defacing-the-music. Read CLAUDE.md, then TASKS.md. Do ONLY the first open [ ] task: create branch claude/<task-id-lowercase>, implement it fully, mark it [x] in TASKS.md with a one-line note, commit, push the branch, and open a PR to main with gh (list anything Dillon must do under 'Dillon needs to' at the top of the body). If no open task remains, do nothing. Never push to main, never touch .github/workflows, never print secrets, never deploy." --dangerously-skip-permissions
